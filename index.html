<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>YAZZ Remote - Google Dice Controller</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 60px; background: #eef2f3; }
        .card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 320px; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; }
        input { font-size: 20px; padding: 12px; width: 120px; text-align: center; border: 2px solid #ddd; border-radius: 6px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #4285f4; }
        button { font-size: 16px; font-weight: bold; padding: 12px 24px; background: #4285f4; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; transition: background 0.2s; }
        button:hover { background: #357ae8; }
        #status { margin-top: 15px; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>YAZZ Remote</h2>
        <p>Masukkan angka dadu yang diinginkan:</p>
        <input type="number" id="diceInput" min="1" max="20" value="6">
        <br>
        <button onclick="sendData()">Kirim ke Google Dice</button>
        <div id="status"></div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARkhR_ijs6cK09GGojNd6mrzVa7yISpy8",
            authDomain: "planning-with-ai-a30a9.firebaseapp.com",
            databaseURL: "https://planning-with-ai-a30a9-default-rtdb.firebaseio.com/",
            projectId: "planning-with-ai-a30a9",
            storageBucket: "planning-with-ai-a30a9.firebasestorage.app",
            messagingSenderId: "741900927853",
            appId: "1:741900927853:web:3bb0e0f6aa2dd7c8cf1064"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function sendData() {
            const val = document.getElementById('diceInput').value;
            const statusEl = document.getElementById('status');
            
            db.ref('google_dice/target_value').set({
                value: Number(val),
                timestamp: Date.now()
            }, (error) => {
                if (error) {
                    statusEl.style.color = '#d93025';
                    statusEl.innerText = 'Gagal mengirim!';
                } else {
                    statusEl.style.color = '#188038';
                    statusEl.innerText = 'Berhasil dikirim: ' + val;
                }
            });
        }
    </script>
</body>
</html>
